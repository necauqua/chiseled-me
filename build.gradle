buildscript {
    repositories {
        maven { url = 'https://maven.necauqua.dev' }
    }
    dependencies {
        classpath 'dev.necauqua:necauqua-mod:0.7.1'
    }
}

apply plugin: 'dev.necauqua.nmod'

sourceSets { api }

nmod {
    curseID = '448650'
    version = '1.16-1.0.0.0'
    forge = '1.16.5-36.2.20'
    mixin = '0.8.4'
    mappings = '1.16.5'
}

// region deobf artifacts in maven local lul

task deobfJar(type: Jar) {
    from sourceSets.api.output
    from sourceSets.main.output
    archiveClassifier.set('deobf')
}

task deobfApiJar(type: Jar) {
    from sourceSets.api.output
    archiveClassifier.set('api-deobf')
}

artifacts {
    archives deobfJar
    archives deobfApiJar
}

publishing.publications[0].with {
    artifact deobfJar
    artifact deobfApiJar
}

// endregion

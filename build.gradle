buildscript {
    repositories {
        maven { url = 'https://maven.necauqua.dev' }
    }
    dependencies {
        classpath 'dev.necauqua:necauqua-mod:0.7.1'
    }
}

apply plugin: 'dev.necauqua.nmod'

nmod {
    curseID = '250075'
    version = '1.16-1.0.0.0'
    forge = '1.16.5-36.2.20'
    mixin = '0.8.4'
    mappings = '1.16.5'
    githubRepo = 'chiseled-me'
}

repositories {
    mavenLocal()
    maven {
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    compileOnly 'dev.necauqua.mods:theta:1.16-1.0.0.0:api-deobf'
    runtimeOnly 'dev.necauqua.mods:theta:1.16-1.0.0.0:deobf'

    implementation fg.deobf("curse.maven:jei-238222:3590083")
    implementation fg.deobf("curse.maven:chiselandbits-231095:3593643")
}
